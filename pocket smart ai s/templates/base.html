<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart
        <span>AI</span>
    </a>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/home-planner">
            Home Interior
        </a>

        <a href="/party-planner">
            Party
        </a>

        <a href="/jewelry-planner">
            Jewelry
        </a>

        <a href="/history">
            History
        </a>

        <a href="/login">
            Login
        </a>

        <a
            class="nav-button"
            href="/register"
        >
            Register
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    © 2026 PocketSmart AI ·
    Budget smarter, decide faster.

</footer>


<script src="/static/js/app.js"></script>


{% block scripts %}
{% endblock %}

</body>

</html>
