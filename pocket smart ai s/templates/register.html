{% extends "base.html" %}

{% block title %}
Register — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <p class="eyebrow">
        CREATE ACCOUNT
    </p>

    <h1>
        Register
    </h1>


    <form id="registerForm">

        <label>

            Name

            <input
                name="name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
                minlength="6"
            >

        </label>


        <button
            class="button"
            type="submit"
        >

            Create Account

        </button>

    </form>


    <p
        id="message"
        class="message"
    ></p>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script>
    bindRegister();
</script>

{% endblock %}
