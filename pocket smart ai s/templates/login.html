{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <p class="eyebrow">
        WELCOME BACK
    </p>

    <h1>
        Login
    </h1>


    <form id="loginForm">

        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <label class="check">

            <input
                type="checkbox"
                name="remember"
            >

            Remember Me

        </label>


        <button
            class="button"
            type="submit"
        >

            Login

        </button>

    </form>


    <p
        id="message"
        class="message"
    ></p>


    <p>

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script>
    bindLogin();
</script>

{% endblock %}
